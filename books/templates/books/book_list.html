<h1>Список книг</h1>

{% for book in books %}
    <div style="margin-bottom: 15px;">
        <h2>
            <a href="{% url 'book_detail' book.id %}">
                {{ book.title }}
            </a>
        </h2>

        <p><b>Автор:</b> {{ book.author }}</p>
        <p><b>Цена:</b> {{ book.price }}</p>
    </div>
{% empty %}
    <p>Книг пока нет</p>
{% endfor %}
